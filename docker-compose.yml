services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_local_only
    # loopback-only publish (ADR-0018): the host dev workflow (alembic, tests)
    # connects on localhost:5432, but the DB must never be reachable on all
    # interfaces. The password is a documented throwaway local-only credential.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U atlas"], interval: 5s, retries: 10}
    # Come back with the daemon after a reboot / daemon restart (2026-08-30: a
    # host reboot left db down and the launchd-supervised API looping exit 3).
    # `unless-stopped` still honours an explicit `docker compose stop`.
    restart: unless-stopped
  redis:
    image: redis:7
    restart: unless-stopped
    # NO host publication (ADR-0018): Redis is declared but unused by any code
    # (no `import redis` in atlas/) and no developer workflow connects to it from
    # the host. The service stays for compose-network access — the api reaches it
    # at redis:6379 over the bridge (ATLAS_REDIS_URL below) — but the port is not
    # exposed on the host at all. Re-add a `ports: ["127.0.0.1:6379:6379"]` (and
    # document the reason) only if a host workflow ever needs it.
  api:
    build: .
    # uvicorn stays --host 0.0.0.0 INSIDE the container: Docker's published-port
    # path DNATs the host interface to the container's bridge IP (not its
    # loopback), so binding uvicorn to 127.0.0.1 in-container makes the API
    # unreachable even from the host. The security-effective bind is the ports
    # host-interface prefix below (127.0.0.1) — the unauthenticated API is
    # reachable ONLY from the local host, never on all interfaces (ADR-0018,
    # independent-review finding: no API auth yet).
    command: uvicorn atlas.api.main:app --host 0.0.0.0 --port 8000
    environment:
      # F-019/F-020: the RUNTIME connects as the least-privilege atlas_app role
      # (non-superuser, non-owner — provisioned by migration 0043), NOT the owner
      # `atlas`. A superuser runtime could disable the audit append-only /
      # monotonic-anchor triggers via session_replication_role; atlas_app cannot.
      # Migrations still run as the owner `atlas` (host: `alembic upgrade head`)
      # BEFORE this service starts, so the role + grants exist. With
      # ATLAS_DB_REQUIRE_LEAST_PRIVILEGE=true the app fails closed at startup if it
      # ever finds itself connected as a superuser.
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas_app:atlas_app_local_only@db:5432/atlas
      ATLAS_DB_REQUIRE_LEAST_PRIVILEGE: "true"
      ATLAS_REDIS_URL: redis://redis:6379/0
      ATLAS_TRADING_MODE: paper
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
