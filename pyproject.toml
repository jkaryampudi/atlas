[project]
name = "atlas"
version = "0.1.0"
description = "Atlas AI Capital — AI investment operating system (Phase 1 foundation)"
# M49 (reproducibility substrate): the SUPPORTED floor is 3.12 — atlas/ compiles
# clean on 3.12.13 and doctor.py gates on >= (3,12), so the code does not require
# 3.14 and the range must not be narrowed to it. Reproduction pins the exact
# DEV/CI interpreter separately in .python-version (3.14.4) — pinning the runtime,
# not the compatibility contract (hostile-review of fbbd199, P1).
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "exchange_calendars>=4.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10"]
dashboard = ["streamlit>=1.36"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"   # type-check against the SUPPORTED floor (P1), so code
                          # that would break the 3.12 minimum is caught
strict = true
files = ["atlas/core", "atlas/dcp", "atlas/fxlab"]

[[tool.mypy.overrides]]
module = "exchange_calendars.*"
ignore_missing_imports = true
